# GitHub backend configured for Bcro22/construction-advice-co.
# Connect this repository to the Netlify project for continuous deployment.
backend:
  name: github
  repo: Bcro22/construction-advice-co
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"
publish_mode: simple

collections:
  - name: "site_content"
    label: "Website"
    files:
      - label: "Site Content & Pricing"
        name: "site"
        file: "content/site.json"
        format: "json"
        fields:
          - label: "Global Settings"
            name: "global"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Top Bar Message", name: "topbar", widget: "string" }
              - { label: "Contact Email", name: "contactEmail", widget: "string" }
              - { label: "Schedule Button Label", name: "scheduleLabel", widget: "string" }
              - { label: "Schedule Button URL", name: "scheduleUrl", widget: "string" }
              - { label: "Footer Description", name: "footerDescription", widget: "text" }
              - { label: "Footer Disclaimer", name: "disclaimer", widget: "text" }
              - label: "Payments & Scheduling Links"
                name: "integrations"
                widget: "object"
                collapsed: false
                fields:
                  - { label: "$49.99 Quick Review Stripe URL", name: "stripeQuickReview", widget: "string", required: false }
                  - { label: "$295 Second Opinion Stripe URL", name: "stripeConstructionSecondOpinion", widget: "string", required: false }
                  - { label: "$595 Bid Review Stripe URL", name: "stripeBidScopeReview", widget: "string", required: false }
                  - { label: "$149 Strategy Session Scheduling URL", name: "scheduleStrategySession", widget: "string", required: false }
                  - { label: "Site Walk Scheduling URL", name: "scheduleSiteWalk", widget: "string", required: false }
                  - { label: "Owner's Advisor Application URL", name: "ownerAdvisorApply", widget: "string", required: false }

          - label: "Homepage"
            name: "home"
            widget: "object"
            collapsed: false
            fields:
              - label: "Show / Hide Sections"
                name: "visibility"
                widget: "object"
                fields:
                  - { label: "Hero", name: "hero", widget: "boolean", default: true }
                  - { label: "Trust Bar", name: "trust", widget: "boolean", default: true }
                  - { label: "How I Can Help", name: "help", widget: "boolean", default: true }
                  - { label: "Project Types", name: "projects", widget: "boolean", default: true }
                  - { label: "Experience", name: "experience", widget: "boolean", default: true }
                  - { label: "Bottom CTA", name: "finalCta", widget: "boolean", default: true }

              - label: "Hero"
                name: "hero"
                widget: "object"
                fields:
                  - { label: "Small Heading", name: "eyebrow", widget: "string" }
                  - { label: "Headline Line 1", name: "title1", widget: "string" }
                  - { label: "Headline Line 2", name: "title2", widget: "string" }
                  - { label: "Intro Paragraph", name: "body", widget: "text" }
                  - { label: "Primary Button", name: "primaryLabel", widget: "string" }
                  - { label: "Primary Button URL", name: "primaryUrl", widget: "string" }
                  - { label: "Secondary Button", name: "secondaryLabel", widget: "string" }
                  - { label: "Secondary Button URL", name: "secondaryUrl", widget: "string" }
                  - { label: "Proof Bold Text", name: "proofBold", widget: "string" }
                  - { label: "Proof Supporting Text", name: "proofText", widget: "string" }

              - label: "Ask the Builder"
                name: "ask"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Intro", name: "intro", widget: "text" }
                  - { label: "Submit Button", name: "button", widget: "string" }
                  - { label: "Small Note", name: "note", widget: "text" }

              - label: "Trust Bar"
                name: "trust"
                widget: "list"
                min: 4
                max: 4
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "text", widget: "string" }

              - label: "How I Can Help Header"
                name: "help"
                widget: "object"
                fields:
                  - { label: "Small Heading", name: "eyebrow", widget: "string" }
                  - { label: "Main Heading", name: "title", widget: "string" }
                  - { label: "Intro", name: "intro", widget: "text" }

              - label: "Services & Pricing"
                name: "services"
                widget: "object"
                collapsed: false
                fields:
                  - label: "Quick Second Opinion"
                    name: "quickReview"
                    widget: "object"
                    fields: &service_fields
                      - { label: "Name", name: "title", widget: "string" }
                      - { label: "Price", name: "price", widget: "string" }
                      - { label: "Description", name: "description", widget: "text" }
                      - label: "Bullets"
                        name: "bullets"
                        widget: "list"
                        min: 3
                        max: 3
                        field: { label: "Bullet", name: "bullet", widget: "string" }
                      - { label: "Button Label", name: "buttonLabel", widget: "string" }
                      - { label: "Button URL", name: "buttonUrl", widget: "string" }
                      - { label: "Badge", name: "badge", widget: "string", required: false }
                  - label: "Construction Second Opinion"
                    name: "secondOpinion"
                    widget: "object"
                    fields: *service_fields
                  - label: "Bid & Scope Review"
                    name: "bidReview"
                    widget: "object"
                    fields: *service_fields
                  - label: "Owner's Advisor"
                    name: "ownersAdvisor"
                    widget: "object"
                    fields: *service_fields
                  - label: "Project Strategy Session"
                    name: "strategy"
                    widget: "object"
                    fields:
                      - { label: "Name", name: "title", widget: "string" }
                      - { label: "Price", name: "price", widget: "string" }
                      - { label: "Description", name: "description", widget: "text" }
                      - { label: "Button Label", name: "buttonLabel", widget: "string" }
                      - { label: "Button URL", name: "buttonUrl", widget: "string" }
                  - label: "Project Rescue Review"
                    name: "projectRescue"
                    widget: "object"
                    fields: &secondary_fields
                      - { label: "Name", name: "title", widget: "string" }
                      - { label: "Price", name: "price", widget: "string" }
                      - { label: "Description", name: "description", widget: "text" }
                      - { label: "Button Label", name: "buttonLabel", widget: "string" }
                      - { label: "Button URL", name: "buttonUrl", widget: "string" }
                  - label: "Site Walk"
                    name: "siteWalk"
                    widget: "object"
                    fields: *secondary_fields
                  - label: "Site Walk + Report"
                    name: "siteReport"
                    widget: "object"
                    fields: *secondary_fields

              - label: "Project Types"
                name: "projects"
                widget: "list"
                min: 7
                max: 7
                field: { label: "Project Type", name: "project", widget: "string" }

              - label: "Experience Section"
                name: "experience"
                widget: "object"
                fields:
                  - { label: "Small Heading", name: "eyebrow", widget: "string" }
                  - { label: "Headline Part 1", name: "title1", widget: "string" }
                  - { label: "Headline Accent", name: "title2", widget: "string" }
                  - { label: "Paragraph 1", name: "paragraph1", widget: "text" }
                  - { label: "Paragraph 2", name: "paragraph2", widget: "text" }
                  - label: "Stats"
                    name: "stats"
                    widget: "list"
                    min: 3
                    max: 3
                    fields:
                      - { label: "Big Value", name: "value", widget: "string" }
                      - { label: "Label", name: "label", widget: "string" }

              - label: "Bottom Call to Action"
                name: "finalCta"
                widget: "object"
                fields:
                  - { label: "Headline", name: "title", widget: "string" }
                  - { label: "Text", name: "text", widget: "string" }
                  - { label: "Button Label", name: "buttonLabel", widget: "string" }
                  - { label: "Button URL", name: "buttonUrl", widget: "string" }

          - label: "Services Page"
            name: "servicesPage"
            widget: "object"
            fields:
              - { label: "Small Heading", name: "eyebrow", widget: "string" }
              - { label: "Headline", name: "title", widget: "string" }
              - { label: "Intro", name: "intro", widget: "text" }
              - label: "Free Question"
                name: "freeQuestion"
                widget: "object"
                fields:
                  - { label: "Name", name: "title", widget: "string" }
                  - { label: "Price", name: "price", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
                  - { label: "Button Label", name: "buttonLabel", widget: "string" }
                  - { label: "Button URL", name: "buttonUrl", widget: "string" }
              - { label: "Pricing Disclaimer", name: "notice", widget: "text" }

          - label: "About Page"
            name: "about"
            widget: "object"
            fields:
              - { label: "Small Heading", name: "eyebrow", widget: "string" }
              - { label: "Headline", name: "title", widget: "string" }
              - { label: "Intro", name: "intro", widget: "text" }
              - { label: "Left Card Title", name: "leftTitle", widget: "string" }
              - { label: "Left Paragraph 1", name: "leftP1", widget: "text" }
              - { label: "Left Paragraph 2", name: "leftP2", widget: "text" }
              - { label: "Right Card Title", name: "rightTitle", widget: "string" }
              - label: "Right Card Bullets"
                name: "rightBullets"
                widget: "list"
                min: 5
                max: 5
                field: { label: "Bullet", name: "bullet", widget: "string" }

          - label: "FAQ Page"
            name: "faq"
            widget: "object"
            fields:
              - { label: "Small Heading", name: "eyebrow", widget: "string" }
              - { label: "Headline", name: "title", widget: "string" }
              - { label: "Intro", name: "intro", widget: "text" }
              - label: "FAQ Items"
                name: "items"
                widget: "list"
                min: 6
                max: 6
                fields:
                  - { label: "Question", name: "question", widget: "string" }
                  - { label: "Answer", name: "answer", widget: "text" }

          - label: "$49.99 Quick Review Page"
            name: "quickReviewPage"
            widget: "object"
            fields:
              - { label: "Small Heading", name: "eyebrow", widget: "string" }
              - { label: "Headline", name: "title", widget: "string" }
              - { label: "Intro", name: "intro", widget: "text" }
              - { label: "Payment Step Heading", name: "paymentTitle", widget: "string" }
              - { label: "Payment Step Text", name: "paymentText", widget: "text" }
              - { label: "Intake Small Heading", name: "intakeEyebrow", widget: "string" }
              - { label: "Intake Heading", name: "intakeTitle", widget: "string" }
              - { label: "Intake Intro", name: "intakeIntro", widget: "text" }

          - label: "$149 Strategy Session Page"
            name: "strategyPage"
            widget: "object"
            fields:
              - { label: "Small Heading", name: "eyebrow", widget: "string" }
              - { label: "Headline", name: "title", widget: "string" }
              - { label: "Intro", name: "intro", widget: "text" }
              - { label: "Included Heading", name: "includedTitle", widget: "string" }
              - label: "Included Items"
                name: "included"
                widget: "list"
                min: 5
                max: 5
                field: { label: "Item", name: "item", widget: "string" }
              - { label: "Notice", name: "notice", widget: "text" }
              - { label: "Booking Heading", name: "bookingTitle", widget: "string" }
              - { label: "Booking Text", name: "bookingText", widget: "text" }
              - { label: "Button Label", name: "buttonLabel", widget: "string" }
              - { label: "Button URL", name: "buttonUrl", widget: "string" }
